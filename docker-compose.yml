services:
  db:
    image: postgres:16-alpine
    container_name: jackson-postgres
    restart: always
    environment:
      POSTGRES_USER: jackson
      POSTGRES_PASSWORD: jackson_pass
      POSTGRES_DB: jackson_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jackson -d jackson_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
